<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="QuantLab">
  <!--
    QuantLab favicon concept:
    - 深空蓝底：量化研究的沉稳底色与数据海洋
    - K线蜡烛 ×3：行情 / 量化分析的核心对象
    - 上升箭头：量化模型发现趋势（信号青高亮）
    - 扫描线：算法逐点分析 / 模式发现引擎
    - 星点：策略灵感 / 数据中的洞察
  -->
  <defs>
    <linearGradient id="bg" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14293F"/>
      <stop offset="100%" stop-color="#0A1A2E"/>
    </linearGradient>
    <linearGradient id="scan" x1="6" y1="22" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#00D2FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7CF0FF" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- rounded brand tile -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#bg)"/>

  <!-- soft upper glow -->
  <circle cx="10" cy="9" r="8" fill="#ffffff" opacity="0.05"/>

  <!-- candle 1: 横盘（白 半透明） -->
  <rect x="8" y="15" width="2.2" height="6" rx="0.5" fill="#F5F7FA" opacity="0.4"/>
  <line x1="9.1" y1="12.5" x2="9.1" y2="21.5" stroke="#F5F7FA" stroke-opacity="0.4" stroke-width="0.8"/>

  <!-- candle 2: 上涨（青绿） -->
  <rect x="12.6" y="12" width="2.2" height="6" rx="0.5" fill="#00E5A0" opacity="0.75"/>
  <line x1="13.7" y1="10.5" x2="13.7" y2="18.5" stroke="#00E5A0" stroke-opacity="0.75" stroke-width="0.8"/>

  <!-- candle 3: 放量突破（信号青高亮） -->
  <rect x="17.2" y="9.5" width="2.2" height="6.5" rx="0.5" fill="#00E5A0"/>
  <line x1="18.3" y1="7.8" x2="18.3" y2="16.5" stroke="#00E5A0" stroke-width="0.8"/>

  <!-- rising arrow: 量化发现趋势 -->
  <path d="M22.2 21.8 L26 18 M26 18 L23.4 17.8 M26 18 L25.8 20.6"
        fill="none" stroke="#00D2FF" stroke-width="1.3"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- scan line: 算法逐点分析 -->
  <path d="M5.5 25.5 C9.5 24, 13 27, 16.5 25.5 C20 24, 22.5 25.5, 26.5 24.8"
        fill="none" stroke="url(#scan)" stroke-width="1.3" stroke-linecap="round"/>

  <!-- star: 策略灵感 -->
  <g transform="translate(25.2 6.8)">
    <path d="M0-2 L0.55-0.55 L2.4 0 L0.55 0.55 L0 2 L-0.55 0.55 L-2.4 0 L-0.55-0.55 Z" fill="#00D2FF"/>
    <circle cx="0" cy="0" r="0.55" fill="#F5F7FA"/>
  </g>
</svg>
